<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FYSM Abstract Yoga Morph</title>
<style>
:root{--cream:#f4efe4;--green:#285242;--coral:#d99079;--yellow:#e2d19a;--ink:#17372d}
*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}body{min-height:100vh;display:grid;place-items:center}.wrap{width:min(1180px,100%);padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.brand{font-size:12px;font-weight:850;letter-spacing:.14em}.controls{display:flex;gap:7px;flex-wrap:wrap}.controls button{border:1.5px solid var(--green);border-radius:999px;background:transparent;color:var(--green);padding:8px 12px;font-weight:750}.controls button.on{background:var(--green);color:var(--cream)}.card{border:1.5px solid var(--green);border-radius:34px;overflow:hidden;position:relative;min-height:680px;background:var(--cream)}svg{width:100%;height:auto;display:block}.label{position:absolute;left:22px;bottom:18px;background:var(--cream);border:1.5px solid var(--green);border-radius:999px;padding:8px 12px;font-size:11px;font-weight:850;letter-spacing:.08em}.note{font-size:12px;opacity:.62;margin:10px 4px 0}.mat{fill:var(--green)}.girl{fill:none;stroke:var(--coral);stroke-linecap:round;stroke-linejoin:round}.head,.bun{fill:var(--coral)}.accent{fill:var(--yellow)}.laptop{fill:var(--yellow)}.screen{fill:var(--green);opacity:.92}.orbit{fill:none;stroke:var(--yellow);stroke-width:13;stroke-linecap:round;opacity:0}.floorDot{fill:var(--yellow);opacity:.75}@media(max-width:720px){.card{min-height:0}.top{align-items:flex-start;flex-direction:column}.label{left:12px;bottom:10px}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">FYSM YOGA · ABSTRACT MORPH STUDY</div><div class="controls"><button id="pause">Pause</button><button data-speed=".65">Slow</button><button class="on" data-speed="1">1×</button><button data-speed="1.35">Fast</button></div></div>
<section class="card"><svg viewBox="0 0 1000 700" aria-label="Five abstract yoga poses morphing in a loop">
<rect width="1000" height="700" fill="#f4efe4"/>
<g id="laptop" transform="translate(770 430)"><rect class="laptop" x="0" y="0" width="142" height="104" rx="24" transform="skewX(-9)"/><rect class="screen" x="18" y="17" width="104" height="66" rx="17" transform="skewX(-9)"/><rect class="laptop" x="-20" y="108" width="178" height="24" rx="12"/></g>
<path id="orbit1" class="orbit" d="M225 305 C285 180 440 135 560 190"/><path id="orbit2" class="orbit" d="M660 265 C725 350 715 440 665 500"/>
<rect class="mat" x="170" y="604" width="570" height="30" rx="15"/>
<g id="figure"><path id="torso" class="girl" stroke-width="82"/><path id="armL" class="girl" stroke-width="43"/><path id="armR" class="girl" stroke-width="43"/><path id="legL" class="girl" stroke-width="55"/><path id="legR" class="girl" stroke-width="55"/><circle id="head" class="head" r="34"/><circle id="bun" class="bun" r="18"/></g>
<circle id="dot1" class="floorDot" cx="120" cy="210" r="16"/><path id="bean" class="accent" d="M102 245 C150 225 174 248 153 276 C131 303 87 293 84 270 C82 257 88 250 102 245Z"/>
</svg><div class="label" id="poseLabel">TREE</div></section><div class="note">Tree → Warrior II → Downward Dog → Dancer → Child’s Pose. No Cobra. One abstract faceless woman, rounded blob geometry, fixed mat, center-spin morph.</div></main>
<script>
const poses=[
{name:'TREE',h:[455,190],b:[488,174],s:[455,270],p:[455,405],le:[410,320],lh:[455,348],re:[500,320],rh:[455,348],lk:[455,500],lf:[455,568],rk:[520,450],rf:[460,493]},
{name:'WARRIOR II',h:[455,205],b:[489,191],s:[455,282],p:[455,405],le:[345,285],lh:[245,285],re:[565,285],rh:[665,285],lk:[350,475],lf:[255,570],rk:[560,445],rf:[660,570]},
{name:'DOWNWARD DOG',h:[330,402],b:[300,385],s:[372,397],p:[505,292],le:[310,475],lh:[255,570],re:[350,475],rh:[300,570],lk:[585,420],lf:[650,570],rk:[550,415],rf:[610,570]},
{name:'DANCER',h:[430,185],b:[462,168],s:[438,262],p:[452,398],le:[385,305],lh:[330,260],re:[500,300],rh:[560,230],lk:[455,500],lf:[455,570],rk:[545,400],rf:[590,290]},
{name:"CHILD'S POSE",h:[570,475],b:[600,458],s:[515,490],p:[390,475],le:[595,525],lh:[675,565],re:[560,535],rh:[635,575],lk:[350,535],lf:[300,570],rk:[405,540],rf:[350,570]}
];
const $=id=>document.getElementById(id),fig=$('figure'),torso=$('torso'),armL=$('armL'),armR=$('armR'),legL=$('legL'),legR=$('legR'),head=$('head'),bun=$('bun'),label=$('poseLabel'),o1=$('orbit1'),o2=$('orbit2'),laptop=$('laptop');
let speed=1,paused=false,start=performance.now(),pausedAt=0;const hold=1150,trans=1450,slot=hold+trans,total=slot*poses.length;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],smooth=t=>t*t*(3-2*t),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function qpath(a,b,c){return `M ${a[0]} ${a[1]} Q ${b[0]} ${b[1]} ${c[0]} ${c[1]}`}function lpath(a,b){return `M ${a[0]} ${a[1]} Q ${(a[0]+b[0])/2} ${(a[1]+b[1])/2} ${b[0]} ${b[1]}`}function lerpPose(a,b,t){let r={};for(const k of ['h','b','s','p','le','lh','re','rh','lk','lf','rk','rf'])r[k]=mix(a[k],b[k],t);return r}
function setPose(p,spin,phase){torso.setAttribute('d',lpath(p.s,p.p));armL.setAttribute('d',qpath(p.s,p.le,p.lh));armR.setAttribute('d',qpath(p.s,p.re,p.rh));legL.setAttribute('d',qpath(p.p,p.lk,p.lf));legR.setAttribute('d',qpath(p.p,p.rk,p.rf));head.setAttribute('cx',p.h[0]);head.setAttribute('cy',p.h[1]);bun.setAttribute('cx',p.b[0]);bun.setAttribute('cy',p.b[1]);const cx=455,cy=385;fig.setAttribute('transform',`rotate(${spin} ${cx} ${cy})`);const pulse=Math.sin(Math.PI*phase);o1.style.opacity=o2.style.opacity=(.7*pulse).toFixed(3);o1.style.strokeDasharray=`${65+55*pulse} 260`;o2.style.strokeDasharray=`${45+45*pulse} 220`;laptop.setAttribute('transform',`translate(770 430) rotate(${2*Math.sin(phase*Math.PI*2)} 70 65)`)}
function frame(now){if(!paused){let t=((now-start)*speed)%total,idx=Math.floor(t/slot),inside=t-idx*slot,a=poses[idx],b=poses[(idx+1)%poses.length];if(inside<hold){setPose(a,0,0);label.textContent=a.name}else{let u=clamp((inside-hold)/trans,0,1),e=smooth(u),p=lerpPose(a,b,e);setPose(p,360*e,u);label.textContent=u<.52?a.name:b.name}}requestAnimationFrame(frame)}requestAnimationFrame(frame);
$('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';if(paused){pausedAt=performance.now()}else{start+=performance.now()-pausedAt}};document.querySelectorAll('[data-speed]').forEach(btn=>btn.onclick=()=>{speed=+btn.dataset.speed;document.querySelectorAll('[data-speed]').forEach(b=>b.classList.toggle('on',b===btn));start=performance.now()});
</script></body></html>
