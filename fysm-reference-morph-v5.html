<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>FYSM Yoga · reference pose morph</title><script src="https://unpkg.com/flubber@0.4.2/build/flubber.min.js"></script><style>:root{--cream:#f4efe3;--green:#245847;--coral:#dc9079;--yellow:#e5d394;--ink:#244d40}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream)}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden}.wrap{height:100svh;display:grid;place-items:center;padding:20px}.stage{width:min(100%,1080px);height:min(88svh,820px);position:relative;display:grid;place-items:center}svg{width:100%;height:100%;overflow:visible}.ui{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 12px;border:1.5px solid rgba(36,88,71,.28);border-radius:999px;background:rgba(244,239,227,.86);backdrop-filter:blur(12px);font-size:12px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.32}.dot.on{opacity:1}.name{font-weight:800;min-width:112px;text-align:center}@media(max-width:650px){.wrap{padding:6px}.stage{height:94svh}.ui{bottom:4px;font-size:10px;gap:7px}.name{min-width:92px}}</style></head><body><div class="wrap"><div class="stage"><svg viewBox="0 0 900 700"><g id="figure" transform-origin="450px 350px"><path id="body" fill="#e5d394" d="M250 455 C286 405 320 370 365 346 C405 325 448 326 480 350 C505 369 524 397 548 420 C566 438 589 447 611 447 C632 447 650 457 651 474 C652 491 636 503 615 502 C574 500 540 486 510 463 C488 447 470 431 451 420 C429 407 407 408 389 420 C366 435 351 460 332 480 C312 501 281 506 259 492 C239 479 236 473 250 455 Z"/><ellipse id="head" cx="645" cy="428" rx="31" ry="34" fill="#e5d394"/></g></svg><div class="ui"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="name">child's pose</span></div></div></div><script>const poses=[{name:"child's pose",color:"#e5d394",head:[645,428,31,34],path:`M250 455 C286 405 320 370 365 346 C405 325 448 326 480 350 C505 369 524 397 548 420 C566 438 589 447 611 447 C632 447 650 457 651 474 C652 491 636 503 615 502 C574 500 540 486 510 463 C488 447 470 431 451 420 C429 407 407 408 389 420 C366 435 351 460 332 480 C312 501 281 506 259 492 C239 479 236 473 250 455 Z`},{name:"low lunge",color:"#e5d394",head:[594,151,29,32],path:`M216 469 C267 435 319 401 366 365 C405 335 437 300 461 257 C482 219 500 180 523 149 C537 130 558 124 573 137 C588 150 586 170 572 189 C551 217 536 250 523 287 C514 314 516 338 535 351 C555 365 584 355 612 350 C646 344 674 355 684 379 C693 402 678 420 653 418 C625 416 601 408 579 414 C556 420 542 439 527 458 C509 481 484 486 465 471 C446 456 446 431 458 405 C467 385 462 371 446 374 C418 380 388 405 354 429 C317 455 278 481 241 496 C218 505 200 489 216 469 Z`},{name:"standing reach",color:"#dc9079",head:[378,219,29,31],path:`M362 252 C379 236 401 235 417 249 C433 263 440 287 444 314 C450 350 456 383 468 414 C480 444 499 469 518 492 C533 510 529 532 511 542 C492 552 475 541 460 522 C442 500 427 477 415 452 C406 433 395 433 384 451 C368 477 350 505 330 528 C315 545 293 545 279 529 C266 513 271 493 286 475 C309 447 330 420 345 392 C359 366 361 342 353 323 C345 304 329 300 313 316 C292 337 272 362 251 382 C235 398 213 397 201 381 C189 365 195 345 211 329 C239 301 266 270 296 244 C317 226 340 232 362 252 Z`},{name:"wide side bend",color:"#dc9079",head:[595,313,30,32],path:`M221 484 C258 431 302 392 350 366 C394 342 441 333 486 337 C527 341 556 328 578 303 C600 277 620 245 645 218 C660 202 681 203 694 217 C708 232 704 252 689 269 C670 291 655 316 643 342 C634 362 639 377 659 392 C686 412 714 438 736 466 C749 483 744 504 727 515 C710 526 691 518 677 501 C650 469 623 444 594 428 C569 414 547 414 528 429 C505 447 487 474 467 499 C453 517 432 520 416 507 C400 494 400 473 412 454 C423 437 417 426 398 428 C362 432 329 453 299 484 C279 505 258 522 238 517 C217 512 208 503 221 484 Z`},{name:"seated twist",color:"#dc9079",head:[438,240,29,31],path:`M413 275 C432 257 458 257 477 274 C496 292 504 319 505 349 C506 372 515 389 535 405 C559 425 584 448 604 473 C618 491 613 511 596 522 C578 534 560 526 545 509 C527 488 509 470 490 458 C472 447 459 450 446 465 C427 488 407 512 383 529 C362 544 338 539 328 520 C318 501 329 483 348 470 C368 456 382 439 389 421 C396 403 388 393 369 396 C342 400 315 417 290 435 C270 449 248 447 236 430 C225 413 232 394 251 381 C285 357 318 335 349 313 C372 297 394 292 413 275 Z`}];const body=document.querySelector('#body'),head=document.querySelector('#head'),figure=document.querySelector('#figure'),dots=[...document.querySelectorAll('.dot')],nameEl=document.querySelector('.name');let idx=0;const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,mix=(a,b,t)=>a+(b-a)*t;function hex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}function color(a,b,t){const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(mix(v,B[i],t))).join(',')})`}function setPose(i){let p=poses[i];body.setAttribute('d',p.path);body.setAttribute('fill',p.color);head.setAttribute('cx',p.head[0]);head.setAttribute('cy',p.head[1]);head.setAttribute('rx',p.head[2]);head.setAttribute('ry',p.head[3]);head.setAttribute('fill',p.color);dots.forEach((d,j)=>d.classList.toggle('on',j===i));nameEl.textContent=p.name}function morph(a,b,duration=1500){return new Promise(resolve=>{const A=poses[a],B=poses[b],interp=flubber.interpolate(A.path,B.path,{maxSegmentLength:6}),start=performance.now();function tick(now){let raw=Math.min(1,(now-start)/duration),t=ease(raw);body.setAttribute('d',interp(t));let h=A.head.map((v,i)=>mix(v,B.head[i],t)),arc=Math.sin(Math.PI*raw)*-18;head.setAttribute('cx',h[0]);head.setAttribute('cy',h[1]+arc);head.setAttribute('rx',h[2]*(1+.055*Math.sin(Math.PI*raw)));head.setAttribute('ry',h[3]*(1-.035*Math.sin(Math.PI*raw)));let c=color(A.color,B.color,t);body.setAttribute('fill',c);head.setAttribute('fill',c);let lift=Math.sin(Math.PI*raw)*-7,sx=1+.018*Math.sin(Math.PI*raw),sy=1-.012*Math.sin(Math.PI*raw);figure.setAttribute('transform',`translate(0 ${lift}) translate(450 350) scale(${sx} ${sy}) translate(-450 -350)`);if(raw<1)requestAnimationFrame(tick);else{figure.removeAttribute('transform');setPose(b);resolve()}}requestAnimationFrame(tick)})}const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function loop(){while(true){await sleep(900);let next=(idx+1)%poses.length;dots.forEach((d,j)=>d.classList.toggle('on',j===next));nameEl.textContent=poses[next].name;await morph(idx,next);idx=next}}setPose(0);loop();</script></body></html>
