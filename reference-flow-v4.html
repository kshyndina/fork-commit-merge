<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FYSM reference-pose flow</title><style>:root{--cream:#F4F0E6;--green:#285242;--coral:#D99079;--yellow:#E2D19A}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Inter,system-ui,sans-serif;color:var(--green)}main{min-height:100vh;display:grid;place-items:center;padding:20px}.wrap{width:min(1100px,100%)}.stage{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--cream)}svg{width:100%;height:100%;display:block}.mat{fill:var(--green)}.body,.limb{fill:none;stroke:var(--coral);stroke-linecap:round;stroke-linejoin:round}.body{stroke-width:86}.limb{stroke-width:52}.head,.bun{fill:var(--coral)}.acc{fill:var(--yellow)}.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.controls{display:flex;gap:8px}.controls button{border:1.5px solid var(--green);background:transparent;color:var(--green);border-radius:999px;padding:8px 12px;font:inherit}.controls button.on{background:var(--green);color:var(--cream)}@media(max-width:650px){.meta{align-items:flex-start;flex-direction:column}}</style></head><body><main><div class="wrap"><div class="stage"><svg viewBox="0 0 1000 625"><rect class="mat" x="160" y="548" width="680" height="26" rx="13"/><ellipse class="acc" id="a1" cx="160" cy="245" rx="20" ry="11" opacity="0"/><ellipse class="acc" id="a2" cx="850" cy="350" rx="16" ry="9" opacity="0"/><path class="body" id="torso"/><path class="limb" id="la"/><path class="limb" id="ra"/><path class="limb" id="ll"/><path class="limb" id="rl"/><ellipse class="head" id="head"/><ellipse class="bun" id="bun"/></svg></div><div class="meta"><div><b id="label">01 · child's pose</b> · poses traced from your reference language</div><div class="controls"><button id="pause">pause</button><button data-sp=".75">slow</button><button class="on" data-sp="1">1×</button></div></div></div></main><script>const P=[{name:"child's pose",c:'#E2D19A',h:[590,475,34,31],b:[620,455,17,16],t:[[405,438],[490,452],[560,480]],la:[[550,470],[625,500],[690,535]],ra:[[545,485],[610,520],[665,548]],ll:[[405,440],[355,500],[300,545]],rl:[[420,445],[405,510],[370,548]]},{name:"low lunge",c:'#E2D19A',h:[560,205,33,31],b:[585,185,16,15],t:[[445,420],[500,325],[540,255]],la:[[525,270],[455,330],[385,390]],ra:[[540,270],[610,330],[665,395]],ll:[[445,420],[350,455],[270,548]],rl:[[450,425],[560,480],[665,548]]},{name:"wide side bend",c:'#D99079',h:[590,260,33,31],b:[620,246,16,15],t:[[500,430],[540,345],[570,300]],la:[[565,300],[500,235],[420,210]],ra:[[575,300],[650,340],[730,420]],ll:[[500,430],[405,470],[300,548]],rl:[[505,430],[610,475],[710,548]]},{name:"standing side reach",c:'#D99079',h:[425,235,33,31],b:[395,220,16,15],t:[[470,420],[455,330],[440,280]],la:[[440,285],[390,340],[335,420]],ra:[[440,280],[470,205],[505,145]],ll:[[470,420],[435,485],[405,548]],rl:[[475,420],[520,485],[555,548]]},{name:"seated side stretch",c:'#285242',h:[365,310,33,31],b:[338,290,16,15],t:[[445,455],[415,390],[390,345]],la:[[390,345],[330,405],[275,455]],ra:[[392,345],[425,260],[455,175]],ll:[[445,455],[350,500],[250,548]],rl:[[445,455],[520,500],[650,548]]}];const E={torso:document.querySelector('#torso'),la:document.querySelector('#la'),ra:document.querySelector('#ra'),ll:document.querySelector('#ll'),rl:document.querySelector('#rl'),head:document.querySelector('#head'),bun:document.querySelector('#bun')},label=document.querySelector('#label'),pause=document.querySelector('#pause');let playing=true,speed=1,start=performance.now(),last=-1;const mix=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;function curve(a,b,t,arc=0){return[mix(a[0],b[0],t),mix(a[1],b[1],t)-Math.sin(Math.PI*t)*arc]}function pts(a,b,t,arc){return a.map((p,i)=>curve(p,b[i],t,arc*(i===1?1:.55)))}function path3(q){return`M${q[0][0].toFixed(1)} ${q[0][1].toFixed(1)} Q${q[1][0].toFixed(1)} ${q[1][1].toFixed(1)} ${q[2][0].toFixed(1)} ${q[2][1].toFixed(1)}`}function frame(now){if(playing){const cycle=3500/speed,u=((now-start)%cycle)/cycle,seg=u*P.length,i=Math.floor(seg),raw=seg-i,j=(i+1)%P.length,hold=.22,t=raw<hold?0:ease((raw-hold)/(1-hold)),A=P[i],B=P[j],arc=[28,18,14,24,20][i];E.torso.setAttribute('d',path3(pts(A.t,B.t,t,arc)));for(const k of['la','ra','ll','rl'])E[k].setAttribute('d',path3(pts(A[k],B[k],t,arc)));const h=A.h.map((v,k)=>mix(v,B.h[k],t)),b=A.b.map((v,k)=>mix(v,B.b[k],t));for(const[e,v]of[[E.head,h],[E.bun,b]]){e.setAttribute('cx',v[0]);e.setAttribute('cy',v[1]);e.setAttribute('rx',v[2]);e.setAttribute('ry',v[3])}const col=t<.5?A.c:B.c;document.querySelectorAll('.body,.limb,.head,.bun').forEach(e=>{if(e.tagName==='path')e.style.stroke=col;else e.style.fill=col});document.querySelector('#a1').setAttribute('opacity',Math.sin(Math.PI*t)*.8);document.querySelector('#a2').setAttribute('opacity',Math.sin(Math.PI*t)*.55);if(i!==last){label.textContent=`0${i+1} · ${A.name}`;last=i}}requestAnimationFrame(frame)}requestAnimationFrame(frame);pause.onclick=()=>{playing=!playing;pause.textContent=playing?'pause':'play';if(playing)start=performance.now()};document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;document.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('on',x===b));start=performance.now()});</script></body></html>
